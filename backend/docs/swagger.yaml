basePath: /
definitions:
  dto.AdminApproveResponse:
    properties:
      message:
        type: string
    type: object
  dto.AdminRejectRequest:
    properties:
      reason:
        type: string
    required:
    - reason
    type: object
  dto.AdminRejectResponse:
    properties:
      message:
        type: string
    type: object
  dto.BusinessVerificationResponse:
    properties:
      message:
        type: string
      verification_record_id:
        type: string
    type: object
  dto.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  dto.ChangePasswordResponse:
    properties:
      message:
        type: string
    type: object
  dto.CheckSlugResponse:
    properties:
      alternatives:
        items:
          type: string
        type: array
      available:
        type: boolean
    type: object
  dto.CreateAgencyProfileRequest:
    properties:
      agency_name:
        type: string
      city:
        type: string
      contact_name:
        type: string
      country:
        type: string
      country_code:
        type: string
      description:
        maxLength: 1000
        type: string
      industries:
        items:
          type: string
        type: array
      logo_url:
        type: string
      phone:
        type: string
      registration_no:
        type: string
      services_offered:
        items:
          type: string
        type: array
      state:
        type: string
      team_size:
        type: string
      timezone:
        type: string
      website_url:
        type: string
    required:
    - agency_name
    type: object
  dto.CreateClientProfileRequest:
    properties:
      budget_range:
        type: string
      city:
        type: string
      company_name:
        type: string
      contact_name:
        type: string
      country:
        type: string
      country_code:
        type: string
      industry:
        type: string
      logo_url:
        type: string
      phone:
        type: string
      project_types:
        items:
          type: string
        type: array
      state:
        type: string
      team_size:
        type: string
      timezone:
        type: string
      website_url:
        type: string
    required:
    - company_name
    type: object
  dto.CreateIndividualProfileRequest:
    properties:
      availability:
        type: string
      avatar_url:
        type: string
      bio:
        maxLength: 500
        type: string
      city:
        type: string
      country:
        type: string
      country_code:
        type: string
      date_of_birth:
        description: typically parseable date string
        type: string
      experience_level:
        description: Freelancer Specific Fields
        type: string
      gender:
        type: string
      github_url:
        type: string
      headline:
        maxLength: 150
        type: string
      linkedin_url:
        type: string
      phone:
        description: Basic Info
        type: string
      portfolio_url:
        type: string
      preferred_language:
        type: string
      profile_visibility:
        type: string
      resume_url:
        type: string
      service_categories:
        items:
          type: string
        type: array
      skills:
        items:
          type: string
        type: array
      state:
        type: string
      terms_confirmed:
        type: boolean
      timezone:
        type: string
      tools_technologies:
        items:
          type: string
        type: array
    type: object
  dto.CreateProfileResponse:
    properties:
      message:
        type: string
      public_url_slug:
        description: Primarily for individual profile, can be empty for others for
          now
        type: string
    type: object
  dto.DeleteAccountRequest:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  dto.ExportResponse:
    properties:
      download_url:
        type: string
      expires_in:
        type: string
      message:
        type: string
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.ForgotPasswordResponse:
    properties:
      message:
        type: string
    type: object
  dto.IdentityVerificationResponse:
    properties:
      message:
        type: string
      verification_record_id:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      message:
        type: string
      refresh_token:
        type: string
    type: object
  dto.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.LogoutResponse:
    properties:
      message:
        type: string
    type: object
  dto.PublicProfileResponse:
    properties:
      account_type:
        type: string
      availability:
        type: string
      avatar_url:
        type: string
      bio:
        type: string
      city:
        type: string
      country:
        type: string
      country_code:
        type: string
      date_of_birth:
        type: string
      experience_level:
        type: string
      first_name:
        description: User info
        type: string
      gender:
        type: string
      github_url:
        type: string
      headline:
        type: string
      last_name:
        type: string
      linkedin_url:
        type: string
      member_since:
        type: string
      phone:
        description: Profile info
        type: string
      points:
        type: integer
      portfolio_url:
        type: string
      preferred_language:
        type: string
      profile_visibility:
        type: string
      public_url_slug:
        type: string
      resume_url:
        type: string
      service_categories:
        items:
          type: string
        type: array
      skills:
        items:
          type: string
        type: array
      state:
        type: string
      timezone:
        type: string
      tools_technologies:
        items:
          type: string
        type: array
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RefreshTokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  dto.ResendVerificationRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.ResendVerificationResponse:
    properties:
      message:
        type: string
    type: object
  dto.ResetPasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  dto.ResetPasswordResponse:
    properties:
      message:
        type: string
    type: object
  dto.ResubmitVerificationResponse:
    properties:
      message:
        type: string
      verification_record_id:
        type: string
    type: object
  dto.SetAccountTypeRequest:
    properties:
      account_type:
        enum:
        - individual
        - agency
        - client
        type: string
      email:
        type: string
      password:
        type: string
    required:
    - account_type
    - email
    - password
    type: object
  dto.UpdateAccountRequest:
    properties:
      email:
        type: string
      new_password:
        type: string
      password:
        description: For verification if changing email/password
        type: string
      phone:
        type: string
    type: object
  dto.UpdateNotificationsRequest:
    properties:
      preferences:
        additionalProperties: true
        type: object
    required:
    - preferences
    type: object
  dto.UpdatePrivacyRequest:
    properties:
      profile_visibility:
        enum:
        - public
        - private
        type: string
    required:
    - profile_visibility
    type: object
  dto.UserPointsResponse:
    properties:
      account_type:
        type: string
      points:
        type: integer
      profile_complete:
        type: boolean
    type: object
  dto.VerificationQueueItem:
    properties:
      created_at:
        type: string
      id:
        type: string
      status:
        type: string
      type:
        type: string
      user_id:
        type: string
    type: object
  dto.VerifyEmailResponse:
    properties:
      message:
        type: string
    type: object
  swagger.DeleteAvatarResponse:
    properties:
      message:
        example: avatar deleted successfully
        type: string
    type: object
  swagger.DeleteLogoResponse:
    properties:
      message:
        example: logo deleted successfully
        type: string
    type: object
  swagger.DeleteProfileAccountResponse:
    properties:
      message:
        example: account successfully scheduled for deletion
        type: string
    type: object
  swagger.DeleteResumeResponse:
    properties:
      message:
        example: resume deleted successfully
        type: string
    type: object
  swagger.ErrorResponse:
    properties:
      error:
        example: error message
        type: string
    type: object
  swagger.LoginBadRequestResponse:
    properties:
      error:
        example: Invalid request body
        type: string
    type: object
  swagger.LoginSuccessResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        example: 3600
        type: integer
      message:
        example: Login successful
        type: string
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  swagger.LoginUnauthorizedResponse:
    properties:
      error:
        example: Invalid email or password
        type: string
    type: object
  swagger.RegisterErrorResponse:
    properties:
      error:
        example: Email already exists
        type: string
    type: object
  swagger.RegisterSuccessResponse:
    properties:
      message:
        example: Registration successful. Please check your email to verify your account.
        type: string
    type: object
  swagger.UpdateAccountResponse:
    properties:
      message:
        example: account settings updated successfully
        type: string
    type: object
  swagger.UpdateNotificationsResponse:
    properties:
      message:
        example: notifications updated successfully
        type: string
    type: object
  swagger.UpdatePrivacySettingsResponse:
    properties:
      message:
        example: privacy settings updated successfully
        type: string
    type: object
  swagger.UploadAvatarResponse:
    properties:
      avatar_url:
        example: https://res.cloudinary.com/demo/image/upload/v123456/avatar.jpg
        type: string
      message:
        example: avatar uploaded successfully
        type: string
    type: object
  swagger.UploadLogoResponse:
    properties:
      logo_url:
        example: https://res.cloudinary.com/demo/image/upload/v123456/logo.png
        type: string
      message:
        example: logo uploaded successfully
        type: string
    type: object
  swagger.UploadResumeResponse:
    properties:
      message:
        example: resume uploaded successfully
        type: string
      resume_url:
        example: https://example.com/resume.pdf
        type: string
    type: object
host: https://techguild-backend.onrender.com
info:
  contact:
    email: support@techguild.com
    name: TechGuild Team
  description: Backend API for TechGuild Platform.
  license:
    name: MIT
  termsOfService: http://swagger.io/terms/
  title: TechGuild Backend API
  version: "1.0"
paths:
  /admin/verification/{id}/approve:
    post:
      description: Approves a verification request.
      parameters:
      - description: Verification Record ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AdminApproveResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Approve verification
      tags:
      - Admin Verification
  /admin/verification/{id}/reject:
    post:
      consumes:
      - application/json
      description: Rejects a verification request with a reason.
      parameters:
      - description: Verification Record ID
        in: path
        name: id
        required: true
        type: string
      - description: Rejection reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AdminRejectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AdminRejectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reject verification
      tags:
      - Admin Verification
  /admin/verification/queue:
    get:
      description: Returns the list of pending verification requests for administrators.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.VerificationQueueItem'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get verification queue
      tags:
      - Admin Verification
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Changes the password of the authenticated user.
      parameters:
      - description: Change password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ChangePasswordResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - Authentication
  /auth/delete-account:
    delete:
      description: Permanently deletes the authenticated user's account.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete account
      tags:
      - Authentication
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a password reset link to the user's registered email address.
      parameters:
      - description: Forgot password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ForgotPasswordResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      summary: Forgot password
      tags:
      - Authentication
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user using email and password and return JWT access
        and refresh tokens.
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.LoginSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.LoginBadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.LoginUnauthorizedResponse'
      summary: User Login
      tags:
      - Authentication
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidates the refresh token and logs the user out.
      parameters:
      - description: Logout request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LogoutResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      summary: Logout user
      tags:
      - Authentication
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Generates a new access token using a valid refresh token.
      parameters:
      - description: Refresh token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RefreshTokenResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      summary: Refresh access token
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new TechGuild user account and send an email verification
        link.
      parameters:
      - description: Registration Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/swagger.RegisterSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.RegisterErrorResponse'
      summary: Register a new user
      tags:
      - Authentication
  /auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Sends a new email verification link to an unverified user.
      parameters:
      - description: Resend verification request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResendVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResendVerificationResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      summary: Resend verification email
      tags:
      - Authentication
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Resets the user's password using the password reset token.
      parameters:
      - description: Password reset token
        in: query
        name: token
        required: true
        type: string
      - description: Reset password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResetPasswordResponse'
        "400":
          description: Invalid or expired token
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      summary: Reset password
      tags:
      - Authentication
  /auth/verify-email:
    get:
      consumes:
      - application/json
      description: Verifies a user's email address using the verification token sent
        via email.
      parameters:
      - description: Email verification token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.VerifyEmailResponse'
        "400":
          description: Invalid or expired token
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      summary: Verify email
      tags:
      - Authentication
  /oauth/github/callback:
    get:
      consumes:
      - application/json
      description: Handles GitHub OAuth callback and authenticates the user.
      parameters:
      - description: GitHub authorization code
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      summary: GitHub OAuth callback
      tags:
      - OAuth
  /oauth/github/login:
    get:
      description: Redirects the user to GitHub's OAuth authorization page.
      produces:
      - application/json
      responses:
        "307":
          description: Redirect to GitHub OAuth
      summary: Login with GitHub
      tags:
      - OAuth
  /oauth/google/callback:
    get:
      consumes:
      - application/json
      description: Handles Google OAuth callback and authenticates the user.
      parameters:
      - description: Google authorization code
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      summary: Google OAuth callback
      tags:
      - OAuth
  /oauth/google/login:
    get:
      description: Redirects the user to Google's OAuth consent screen.
      produces:
      - application/json
      responses:
        "307":
          description: Redirect to Google OAuth
      summary: Login with Google
      tags:
      - OAuth
  /profile:
    post:
      consumes:
      - application/json
      - multipart/form-data
      description: Creates or updates the user's profile based on the selected account
        type.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CreateProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create or update profile
      tags:
      - Profile
  /profile/account-type:
    post:
      consumes:
      - application/json
      description: Sets the user's account type.
      parameters:
      - description: Account type
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SetAccountTypeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      summary: Set account type
      tags:
      - Profile
  /profile/agency:
    post:
      consumes:
      - application/json
      - multipart/form-data
      description: Creates or updates the authenticated user's agency profile.
      parameters:
      - description: Agency profile data (JSON)
        in: body
        name: request
        schema:
          $ref: '#/definitions/dto.CreateAgencyProfileRequest'
      - description: Agency profile JSON
        in: formData
        name: profile_data
        type: string
      - description: Agency logo
        in: formData
        name: logo
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
