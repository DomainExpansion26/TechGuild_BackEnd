basePath: /
definitions:
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  swagger.LoginBadRequestResponse:
    properties:
      error:
        example: Invalid request body
        type: string
    type: object
  swagger.LoginSuccessResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        example: 3600
        type: integer
      message:
        example: Login successful
        type: string
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  swagger.LoginUnauthorizedResponse:
    properties:
      error:
        example: Invalid email or password
        type: string
    type: object
  swagger.RegisterErrorResponse:
    properties:
      error:
        example: Email already exists
        type: string
    type: object
  swagger.RegisterSuccessResponse:
    properties:
      message:
        example: Registration successful. Please check your email to verify your account.
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@techguild.com
    name: TechGuild Team
  description: Backend API for TechGuild Platform.
  license:
    name: MIT
  termsOfService: http://swagger.io/terms/
  title: TechGuild Backend API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user using email and password and return JWT access
        and refresh tokens.
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.LoginSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.LoginBadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.LoginUnauthorizedResponse'
      summary: User Login
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new TechGuild user account and send an email verification
        link.
      parameters:
      - description: Registration Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/swagger.RegisterSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.RegisterErrorResponse'
      summary: Register a new user
      tags:
      - Authentication
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
