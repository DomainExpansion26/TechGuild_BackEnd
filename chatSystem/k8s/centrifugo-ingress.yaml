apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: centrifugo-ingress
  namespace: techguild
  labels:
    app.kubernetes.io/name: centrifugo
    app.kubernetes.io/part-of: techguild-chat
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # WebSocket Upgrade Headers and Long Timeout Support
    nginx.ingress.kubernetes.io/websocket-services: "centrifugo"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
spec:
  tls:
    - hosts:
        - chat.techguild.io
      secretName: chat-techguild-tls
  rules:
    - host: chat.techguild.io
      http:
        paths:
          - path: /connection/websocket
            pathType: ImplementationSpecific
            backend:
              service:
                name: centrifugo
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: centrifugo
                port:
                  number: 8000

